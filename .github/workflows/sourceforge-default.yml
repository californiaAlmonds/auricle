name: SourceForge default download

# SourceForge imports GitHub releases on its own schedule, so this checks
# periodically and points the Windows default download at the newest installer.

on:
  workflow_run:
    workflows: ["Stable release"]
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-default:
    runs-on: ubuntu-latest
    steps:
      - name: Point Windows default at latest installer
        id: win
        shell: bash
        env:
          SF_API_KEY: ${{ secrets.SOURCEFORGE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${SF_API_KEY}" ]; then
            echo "::warning::SOURCEFORGE_API_KEY secret is not set; skipping."
            exit 0
          fi

          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unexpected release version format: ${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          file="/v${version}/auricle-${version}-setup.exe"

          current=$(curl -fsSL --connect-timeout 15 --max-time 30 \
            "https://sourceforge.net/projects/auricle/best_release.json" \
            | jq -r '.platform_releases.windows.filename // empty')
          if [ "$current" = "$file" ]; then
            echo "Windows default is already ${file}."
            exit 0
          fi

          # The public download URL redirects (302) once the file exists and returns 404 before.
          exists=$(curl -s --connect-timeout 15 --max-time 30 -o /dev/null -w '%{http_code}' --max-redirs 0 \
            "https://sourceforge.net/projects/auricle/files${file}/download" || true)
          exists="${exists:-000}"
          if [ "$exists" = "404" ]; then
            echo "${file} is not on SourceForge yet; the next scheduled run will retry."
            exit 0
          fi
          if [ "$exists" != "302" ] && [ "$exists" != "301" ] && [ "$exists" != "200" ]; then
            echo "::warning::Unexpected HTTP ${exists} checking ${file} on SourceForge; will retry on next run."
            exit 0
          fi

          status=$(printf 'data-urlencode = "default=windows"\ndata-urlencode = "api_key=%s"\n' "${SF_API_KEY}" \
            | curl -sS --connect-timeout 15 --max-time 30 -o /dev/null -w '%{http_code}' \
              -H "Accept: application/json" -X PUT --config - \
              "https://sourceforge.net/projects/auricle/files${file}" || true)
          status="${status:-000}"
          if [ "$status" != "200" ]; then
            echo "::error::SourceForge API returned HTTP ${status} for ${file}."
            exit 1
          fi
          echo "Windows default set to ${file} (was ${current:-none})."

      - name: Point Android default at latest universal APK (if present)
        if: steps.win.outputs.version != ''
        continue-on-error: true
        shell: bash
        env:
          SF_API_KEY: ${{ secrets.SOURCEFORGE_API_KEY }}
          VERSION: ${{ steps.win.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SF_API_KEY}" ] || [ -z "${VERSION}" ]; then
            exit 0
          fi

          file="/v${VERSION}/auricle-android-${VERSION}-universal.apk"

          best_json=$(curl -fsSL --connect-timeout 15 --max-time 30 \
            "https://sourceforge.net/projects/auricle/best_release.json" || true)
          if [ -z "$best_json" ]; then
            echo "::warning::Failed to fetch SourceForge best_release.json; skipping Android default."
            exit 0
          fi

          current=$(printf '%s' "$best_json" | jq -r '.platform_releases.android.filename // empty')
          if [ "$current" = "$file" ]; then
            echo "Android default is already ${file}."
            exit 0
          fi

          exists=$(curl -s --connect-timeout 15 --max-time 30 -o /dev/null -w '%{http_code}' --max-redirs 0 \
            "https://sourceforge.net/projects/auricle/files${file}/download" || true)
          exists="${exists:-000}"
          if [ "$exists" = "404" ]; then
            echo "${file} is not on SourceForge yet (or this release has no Android APK); skipping."
            exit 0
          fi
          if [ "$exists" != "302" ] && [ "$exists" != "301" ] && [ "$exists" != "200" ]; then
            echo "::warning::Unexpected HTTP ${exists} checking ${file} on SourceForge; skipping Android default."
            exit 0
          fi

          status=$(printf 'data-urlencode = "default=android"\ndata-urlencode = "api_key=%s"\n' "${SF_API_KEY}" \
            | curl -sS --connect-timeout 15 --max-time 30 -o /dev/null -w '%{http_code}' \
              -H "Accept: application/json" -X PUT --config - \
              "https://sourceforge.net/projects/auricle/files${file}" || true)
          status="${status:-000}"
          if [ "$status" != "200" ]; then
            echo "::warning::SourceForge API returned HTTP ${status} for Android default ${file}."
            exit 0
          fi
          echo "Android default set to ${file} (was ${current:-none})."
