name: Stable release

# Triggered when a pull request from a release/* branch is merged into main.
# The version is taken from the release branch name (already validated against
# Cargo.toml by the non-bypassable "check-version" gate).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Derive version from release branch
        id: ver
        shell: bash
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "version=${BRANCH#release/}" >> "$GITHUB_OUTPUT"

      - name: Build portable binary (self-update enabled)
        run: cargo build --bin native_shell --release

      - name: Build installer binary (self-update disabled)
        run: cargo build --bin native_shell --release --no-default-features --target-dir target/installer

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          # Portable: zip with bin named auricle.exe so self_update can self-replace.
          cp "target/release/native_shell.exe" "auricle.exe"
          7z a "dist/auricle-${V}-portable.zip" "auricle.exe"
          # Installer-profile standalone exe (no self-update); fed to Inno Setup.
          cp "target/installer/release/native_shell.exe" "dist/auricle.exe"

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $V = "${{ steps.ver.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$V" packaging\inno\auricle.iss

      # Code signing is OPTIONAL and disabled until SignPath credentials are added.
      # SignPath Foundation grants free Authenticode signing to OSS projects:
      #   1. Apply at https://about.signpath.io/product/open-source
      #   2. Add repo secrets SIGNPATH_API_TOKEN and SIGNPATH_ORG_ID, then create a
      #      SignPath project "auricle" + signing policy "release-signing".
      #   3. Uncomment the upload + sign steps below; mapping the secret to an env
      #      var (HAS_SIGNPATH) keeps `if:` valid even before the secret exists.
      # - name: Upload artifacts for signing
      #   id: upload
      #   uses: actions/upload-artifact@v4
      #   with: { name: auricle-unsigned, path: dist/ }
      # - name: Code sign (SignPath)
      #   env:
      #     SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ env.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ env.SIGNPATH_ORG_ID }}
      #     project-slug: auricle
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: zip
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true

      - name: Fetch matching Android release APKs (if available)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: ${VERSION}"
            exit 1
          fi

          ANDROID_REPO="californiaAlmonds/auricle-android"
          TAG="v${VERSION}"
          rm -rf dist/android-staging
          mkdir -p dist/android-staging

          # Query public release metadata unauthenticated (avoids cross-repo GITHUB_TOKEN 403s).
          http_code=$(curl -sS --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: auricle-release-sync" \
            -o dist/android-staging/release.json \
            -w '%{http_code}' \
            "https://api.github.com/repos/${ANDROID_REPO}/releases/tags/${TAG}")

          if [ "$http_code" = "404" ]; then
            echo "::warning::No matching ${TAG} release found in ${ANDROID_REPO}; publishing Windows-only release."
            rm -rf dist/android-staging
            exit 0
          fi
          if [ "$http_code" != "200" ]; then
            api_msg=$(jq -r '.message // empty' dist/android-staging/release.json 2>/dev/null | tr -d '\r' || true)
            echo "::error::GitHub API returned HTTP ${http_code} querying ${ANDROID_REPO} ${TAG}${api_msg:+ (${api_msg})}."
            rm -rf dist/android-staging
            exit 1
          fi

          is_draft=$(jq -r '.draft' dist/android-staging/release.json | tr -d '\r')
          is_pre=$(jq -r '.prerelease' dist/android-staging/release.json | tr -d '\r')
          if [ "$is_draft" != "false" ] || [ "$is_pre" != "false" ]; then
            echo "::warning::${ANDROID_REPO} ${TAG} is draft=${is_draft} prerelease=${is_pre}; skipping Android APK sync."
            rm -rf dist/android-staging
            exit 0
          fi

          sums_url=$(jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .browser_download_url' dist/android-staging/release.json | tr -d '\r' | head -n 1)
          mapfile -t apk_lines < <(jq -r --arg v "$VERSION" \
            '.assets[] | select(.name | startswith("auricle-android-" + $v + "-") and endswith(".apk")) | "\(.name)\t\(.browser_download_url)"' \
            dist/android-staging/release.json | tr -d '\r')

          if [ "${#apk_lines[@]}" -eq 0 ]; then
            echo "::warning::${ANDROID_REPO} ${TAG} contained no auricle-android-${VERSION}-*.apk assets; publishing Windows-only release."
            rm -rf dist/android-staging
            exit 0
          fi
          if [ -z "$sums_url" ]; then
            echo "::error::${ANDROID_REPO} ${TAG} is missing SHA256SUMS.txt; refusing to bundle unverified APKs."
            rm -rf dist/android-staging
            exit 1
          fi

          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 60 \
            -o dist/android-staging/SHA256SUMS.txt "$sums_url"
          tr -d '\r' < dist/android-staging/SHA256SUMS.txt > dist/android-staging/SHA256SUMS.lf

          # Download every matching APK asset safely using basename validation
          downloaded_names=()
          for entry in "${apk_lines[@]}"; do
            apk_name="${entry%%$'\t'*}"
            apk_url="${entry#*$'\t'}"
            if [[ ! "$apk_name" =~ ^auricle-android-[0-9A-Za-z._-]+\.apk$ ]]; then
              echo "::error::Rejected unexpected Android asset name: ${apk_name}"
              exit 1
            fi
            curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 \
              -o "dist/android-staging/${apk_name}" "$apk_url"
            downloaded_names+=("$apk_name")
          done

          # Verify every APK listed in SHA256SUMS.txt is present in the downloaded set (prevents partial uploads)
          mapfile -t listed_apks < <(awk 'NF == 2 { f = $2; sub(/^\*/, "", f); if (f ~ /\.apk$/) print f }' dist/android-staging/SHA256SUMS.lf)
          if [ "${#listed_apks[@]}" -eq 0 ]; then
            echo "::error::SHA256SUMS.txt contains no APK checksum entries."
            exit 1
          fi
          for listed in "${listed_apks[@]}"; do
            if [ ! -f "dist/android-staging/${listed}" ]; then
              echo "::error::SHA256SUMS.txt lists ${listed}, but it was not downloaded from ${ANDROID_REPO} ${TAG}."
              exit 1
            fi
          done

          # Verify SHA-256 of every downloaded APK (unique NF==2 match via ENVIRON) before staging into dist/
          for apk_name in "${downloaded_names[@]}"; do
            apk_path="dist/android-staging/${apk_name}"
            expected=$(APK_NAME="$apk_name" awk '
              NF == 2 {
                f = $2; sub(/^\*/, "", f);
                if (f == ENVIRON["APK_NAME"]) { count++; hash = tolower($1) }
              }
              END { if (count == 1) print hash }
            ' dist/android-staging/SHA256SUMS.lf)
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or duplicate SHA-256 entry for ${apk_name} in SHA256SUMS.txt."
              exit 1
            fi
            actual=$(sha256sum "$apk_path" | awk '{ print tolower($1) }')
            if [ "$actual" != "$expected" ]; then
              echo "::error::SHA-256 mismatch for ${apk_name}: expected ${expected}, got ${actual}."
              exit 1
            fi
            echo "Verified ${apk_name} (${actual})."
          done

          # Stage into dist/ only after all APKs pass verification
          for apk_name in "${downloaded_names[@]}"; do
            cp "dist/android-staging/${apk_name}" "dist/${apk_name}"
          done
          rm -rf dist/android-staging

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Auricle ${{ steps.ver.outputs.version }}
          prerelease: false
          body: ${{ github.event.pull_request.body }}
          generate_release_notes: true
          files: |
            dist/auricle-${{ steps.ver.outputs.version }}-portable.zip
            dist/auricle-${{ steps.ver.outputs.version }}-setup.exe
            dist/auricle-android-${{ steps.ver.outputs.version }}-*.apk

      # ── Scoop: update manifest in the bucket repo ────────────────────────────
      - name: Publish Scoop manifest
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          HASH=$(sha256sum "dist/auricle-${V}-portable.zip" | cut -d' ' -f1)
          git clone "https://x-access-token:${{ secrets.SCOOP_BUCKET_TOKEN }}@github.com/californiaAlmonds/scoop-auricle.git" bucket
          mkdir -p bucket/bucket
          sed -e "s/__VERSION__/${V}/g" \
              -e "s/__HASH__/${HASH}/g" \
              packaging/scoop/auricle.json > bucket/bucket/auricle.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/auricle.json
          git commit -m "auricle: update to ${V}" || echo "no changes"
          git push

      # ── Chocolatey: pack + push ──────────────────────────────────────────────
      - name: Publish Chocolatey package
        shell: pwsh
        run: |
          $V = "${{ steps.ver.outputs.version }}"
          $hash = (Get-FileHash "dist/auricle-$V-setup.exe" -Algorithm SHA256).Hash.ToLower()
          (Get-Content packaging/chocolatey/auricle.nuspec).Replace('__VERSION__', $V) | Set-Content packaging/chocolatey/auricle.nuspec
          (Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1).Replace('__VERSION__', $V).Replace('__CHECKSUM__', $hash) | Set-Content packaging/chocolatey/tools/chocolateyinstall.ps1
          choco pack packaging/chocolatey/auricle.nuspec --outputdirectory dist
          choco push "dist/auricle.$V.nupkg" --source https://push.chocolatey.org/ --api-key "${{ secrets.CHOCO_API_TOKEN }}"

      # ── winget: open/refresh manifest PR to microsoft/winget-pkgs ─────────────
      # First-ever submission must be created once with `wingetcreate new`; after
      # the PackageIdentifier exists, this updates it on every release. Needs a
      # GitHub PAT (public_repo) in the WINGET_TOKEN secret.
      - name: Publish to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          $V = "${{ steps.ver.outputs.version }}"
          $url = "https://github.com/californiaAlmonds/auricle/releases/download/v$V/auricle-$V-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # Inno Setup stubs have an x86 PE header even for x64compatible installers,
          # so pass |x64 explicitly to match the manifest's x64 installer node.
          ./wingetcreate.exe update californiaAlmonds.Auricle --version $V --urls "$url|x64" --submit --token "$env:WINGET_TOKEN"
